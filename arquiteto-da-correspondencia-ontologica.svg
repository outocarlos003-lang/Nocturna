<title id="t">O Arquiteto da Correspondência Ontológica</title>
<desc id="d">Composição dark romanticism sobre correspondência, projeção narrativa, revelação e identidade restaurada: uma figura diante de um livro e de uma arquitetura espelhada, atravessada por uma luz que converge para uma forma semelhante à sua origem.</desc>
