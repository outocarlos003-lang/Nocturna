name: Corrigir integração dos títulos dos artigos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Corrigir títulos dos arquivos de artigos
        shell: python
        run: |
          from pathlib import Path
          import html
          import re

          def short_title(title):
              title = html.unescape(title).strip()
              for sep in (":", " — ", " – "):
                  if sep in title:
                      candidate = title.split(sep, 1)[0].strip()
                      if len(candidate) >= 18:
                          return candidate
              if len(title) <= 58:
                  return title
              words = title.split()
              out=[]
              size=0
              for word in words:
                  nxt = (" ".join(out+[word]))
                  if len(nxt) > 55:
                      break
                  out.append(word)
              return " ".join(out).rstrip(" ,;:") + "…"

          changed=[]
          for path in sorted(Path("artigos").glob("*/index.html")):
              text=path.read_text(encoding="utf-8")
              m=re.search(r'(<main id="main"[^>]*><article class="read"><h1>)(.*?)(</h1>)', text, re.S)
              if not m:
                  continue
              full=html.unescape(m.group(2)).strip()
              short=short_title(full)
              text=text[:m.start(2)] + html.escape(short, quote=False) + text[m.end(2):]

              body=re.search(r'(<div class="read-content"[^>]*>)(.*?)(</div>)', text, re.S)
              if body:
                  content=html.unescape(body.group(2))
                  # Corrige a inserção acidental feita na primeira execução.
                  content=re.sub(r'^Nocturna\s*\n\s*\n', '', content, count=1)
                  if full not in content:
                      content=full + "\n\n" + content
                  replacement=body.group(1)+html.escape(content, quote=False)+body.group(3)
                  text=text[:body.start()]+replacement+text[body.end():]

              original=path.read_text(encoding="utf-8")
              if text != original:
                  path.write_text(text,encoding="utf-8")
                  changed.append(str(path))

          print("Corrigidos:", len(changed))
          for p in changed: print(p)

          wf=Path(".github/workflows/once-fix-article-title-integration.yml")
          if wf.exists(): wf.unlink()

      - name: Commit das correções
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artigos .github/workflows/once-fix-article-title-integration.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir integração dos títulos nos artigos"
          git push
