name: Nocturna canonical comments

on:
  workflow_dispatch:
  push:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: nocturna-canonical-comments-issue-1
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  normalize:
    if: ${{ github.event_name != 'issue_comment' || (github.event.issue.number == 1 && !github.event.issue.pull_request && (github.event.action != 'created' || contains(github.event.comment.body, '<!-- nocturna-reply:v1'))) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test genealogical invariants
        run: node scripts/test-genealogy.mjs

      - name: Check canonical Issue #1 availability
        id: canonical_issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/canonical-issue.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/outocarlos003-lang/Nocturna/issues/1)
          if [ "$status" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Canonical Issue #1 is available."
          elif [ "$status" = "410" ] || [ "$status" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Canonical Issue #1 was deleted or is unavailable; preserving the checked-in comment projection and skipping live GitHub synchronization."
          else
            cat /tmp/canonical-issue.json
            echo "Unexpected GitHub API status: $status"
            exit 1
          fi

      - name: Materialize root comment when Issue #1 exists
        if: steps.canonical_issue.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/bootstrap-root-comment.mjs

      - name: Remove duplicate materialized nodes
        if: steps.canonical_issue.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dedupe-genealogy-comments.mjs

      - name: Validate projection before normalization
        if: steps.canonical_issue.outputs.exists == 'true'
        run: node scripts/validate-comments.mjs

      - name: Normalize canonical replies and genealogy
        if: steps.canonical_issue.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/normalize-comments.mjs

      - name: Validate normalized projection
        if: steps.canonical_issue.outputs.exists == 'true'
        run: node scripts/validate-comments.mjs

      - name: Publish site genealogy to Issue #1
        if: steps.canonical_issue.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-genealogy-to-github.mjs

      - name: Verify live GitHub genealogy
        if: steps.canonical_issue.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-github-genealogy.mjs

      - name: Persist projection
        if: steps.canonical_issue.outputs.exists == 'true'
        run: |
          if git diff --quiet -- data/comments/issue-1.json; then
            echo "projection unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comments/issue-1.json
          git commit -m "comments: reconcile GitHub genealogy"
          git push origin HEAD:main

      - name: Generate public route shells and sitemap
        run: node sitemap.mjs https://outocarlos003-lang.github.io/Nocturna/

      - name: Validate generated publication structure
        run: node validate.mjs

      - name: Validate generated repository structure
        run: node scripts/validate-system.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload self-contained Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
