name: Nocturna canonical comments

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

jobs:
  normalize:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.number == 1 && !github.event.issue.pull_request && contains(github.event.comment.body, '<!-- nocturna-reply:v1')) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Materialize root comment when Issue #1 exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/bootstrap-root-comment.mjs

      - name: Validate before normalization
        run: node scripts/validate-comments.mjs

      - name: Normalize canonical replies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/normalize-comments.mjs

      - name: Validate after normalization
        run: node scripts/validate-comments.mjs

      - name: Persist projection
        run: |
          if git diff --quiet -- data/comments/issue-1.json; then
            echo "projection unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comments/issue-1.json
          git commit -m "comments: normalize Issue #1 reply"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload self-contained Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
