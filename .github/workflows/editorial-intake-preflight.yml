name: Editorial request preflight

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  preflight:
    if: contains(github.event.issue.labels.*.name, 'editorial')
    runs-on: ubuntu-latest
    steps:
      - name: Check editorial request completeness
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const section = (heading) => {
              const match = body.match(new RegExp('###\\s+' + heading + '\\s*\\n([\\s\\S]*?)(?=\\n###\\s+|$)', 'i'));
              return match ? match[1].trim() : '';
            };
            const operation = section('Operação');
            const parent = section('Coleção ou bloco de destino');
            const content = section('Conteúdo integral a inserir');
            const checks = section('Verificação');
            const missing = [];
            if (!operation || operation.toLowerCase().includes('selecionar')) missing.push('Operação');
            if (!parent || parent.toLowerCase() === '_no response_') missing.push('Coleção ou bloco de destino');
            if (!content || content.toLowerCase() === '_no response_' || content.length < 30) missing.push('Conteúdo integral a inserir (inclua o texto completo, não apenas um resumo)');
            if (!checks.includes('[x] O texto acima contém integralmente') && !checks.includes('[X] O texto acima contém integralmente')) missing.push('Confirmação de que o material está integralmente incluído');
            const readyLabel = 'editorial-ready';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: readyLabel
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: readyLabel,
                color: '0e8a16',
                description: 'Solicitação editorial completa na pré-verificação'
              });
            }
            if (missing.length) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: readyLabel
              }).catch(error => {
                if (error.status !== 404) throw error;
              });
            } else {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [readyLabel]
              });
            }
            const marker = '<!-- nocturna-editorial-preflight -->';
            const message = missing.length
              ? marker + '\n## Pré-verificação editorial: pendências\n\nA solicitação foi recebida, mas ainda não está pronta para implementação. Complete os itens abaixo para evitar idas e voltas:\n' + missing.map(item => '- [ ] ' + item).join('\n') + '\n\nQuando todos os campos estiverem completos, a solicitação poderá seguir para implementação. Este controle verifica a entrada; não publica nem altera o site sozinho.'
              : marker + '\n## Pré-verificação editorial: entrada completa\n\nOs campos obrigatórios e a confirmação do conteúdo integral foram detectados. A solicitação está pronta para análise e implementação seguindo o modelo existente. A validação automática do repositório continuará sendo executada nas alterações em pull requests. Esta verificação não publica o conteúdo por conta própria.';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100
            });
            const existing = comments.data.find(comment =>
              comment.user && comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: message
              });
            }
