name: Publicar editorial Nocturna

on:
  push:
    branches: [main]
    paths:
      - 'editorial/posts/**'
      - 'editorial/images/**'
      - '.github/workflows/nocturna-publish-editorial.yml'

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip nocturna-publish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrar publicações no DATA editorial
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const indexPath = 'index.html';
          const source = fs.readFileSync(indexPath, 'utf8');
          const m = source.match(/const DATA=(\{[\s\S]*?\});\s*\/\*END DATA\*\//);
          if (!m) throw new Error('DATA editorial não encontrada em index.html');
          const DATA = vm.runInNewContext('(' + m[1] + ')');
          DATA.pubs = Array.isArray(DATA.pubs) ? DATA.pubs : [];
          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
          const parseFrontMatter = text => {
            if (!text.startsWith('---\n')) throw new Error('Front matter ausente');
            const end = text.indexOf('\n---\n', 4);
            if (end < 0) throw new Error('Front matter não terminado');
            const fm = {};
            for (const line of text.slice(4, end).split('\n')) {
              const i = line.indexOf(':');
              if (i < 0) continue;
              const k = line.slice(0,i).trim();
              const v = line.slice(i+1).trim();
              if (v.startsWith('[') && v.endsWith(']')) fm[k] = JSON.parse(v);
              else if (v === 'true' || v === 'false') fm[k] = v === 'true';
              else fm[k] = v;
            }
            return {fm, body:text.slice(end+5)};
          };
          const dir = 'editorial/posts';
          const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f=>f.endsWith('.md')).sort() : [];
          for (const file of files) {
            const {fm,body} = parseFrontMatter(fs.readFileSync(path.join(dir,file),'utf8'));
            if (!fm.id || !fm.title || !fm.date || !fm.summary || !fm.cats || !fm.tags || !fm.image || !fm.imageAlt || !fm.imageCaption) throw new Error('Campos editoriais obrigatórios ausentes em '+file);
            const content = body.replace(/^\n+|\n+$/g,'');
            const pub = {
              id: fm.id,
              title: fm.title,
              date: fm.date,
              featured: false,
              summary: fm.summary,
              cats: fm.cats,
              tags: fm.tags,
              image: {src: fm.image, alt: fm.imageAlt, caption: fm.imageCaption},
              content
            };
            const i = DATA.pubs.findIndex(p=>p.id===pub.id);
            if (i >= 0) DATA.pubs[i] = pub; else DATA.pubs.push(pub);
          }
          const serialized = JSON.stringify(DATA);
          const out = source.replace(/const DATA=(\{[\s\S]*?\});\s*\/\*END DATA\*\//, 'const DATA='+serialized+';/*END DATA*/');
          fs.writeFileSync(indexPath,out,'utf8');
          NODE
      - name: Regenerar rotas, índice público e sitemap
        run: node sitemap.mjs https://outocarlos003-lang.github.io/Nocturna/
      - name: Validar acervo
        run: node validate.mjs
      - name: Persistir publicação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sitemap.xml robots.txt artigos publicacoes buscar categorias tags arquivo series
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publicar postagem editorial [skip nocturna-publish]'
          git push
