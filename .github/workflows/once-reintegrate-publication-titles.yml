name: Reintegrar títulos das publicações

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reintegrar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reintegrar títulos e encurtar listagens
        shell: python
        run: |
          from pathlib import Path
          import html
          import re

          def short_title(title):
              title = html.unescape(title).strip()
              # Mantém no título curto a ideia central que antecede o
              # complemento explicativo do título editorial.
              for sep in (":", " — ", " – "):
                  if sep in title:
                      candidate = title.split(sep, 1)[0].strip()
                      if len(candidate) >= 18:
                          return candidate
              # Fallback para títulos que não possuem separador editorial.
              if len(title) <= 58:
                  return title
              words = title.split()
              out = []
              n = 0
              for word in words:
                  if n + len(word) + (1 if out else 0) > 55:
                      break
                  out.append(word)
                  n += len(word) + (1 if out[:-1] else 0)
              return " ".join(out).rstrip(" ,;:") + "…"

          changed = []
          for path in sorted(Path("artigos").glob("*/index.html")):
              text = path.read_text(encoding="utf-8")
              m = re.search(r'<h1 tabindex="-1">(.*?)</h1>', text, re.S)
              if not m:
                  continue
              full = html.unescape(m.group(1)).strip()
              short = short_title(full)

              # O título visual da página passa a ser curto; o título integral
              # permanece no texto da publicação, como parte do conteúdo.
              new = text[:m.start(1)] + html.escape(short, quote=False) + text[m.end(1):]
              text = new

              body = re.search(r'(<div class="read-content"[^>]*>)(.*?)(</div>)', text, re.S)
              if body:
                  content = html.unescape(body.group(2))
                  if full not in content:
                      replacement = body.group(1) + html.escape(full, quote=False) + "\n\n" + body.group(2) + body.group(3)
                      text = text[:body.start()] + replacement + text[body.end():]

              if text != path.read_text(encoding="utf-8"):
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          # Na página principal, todos os cards passam a exibir o título curto,
          # sem alterar o título editorial completo usado no conteúdo/artigo.
          root = Path("index.html")
          text = root.read_text(encoding="utf-8")
          old = 'empty=m=>l.length?'
          if 'shortTitle=t=>{' not in text:
              marker = 'cards=l=>l.length?'
              helper = 'shortTitle=t=>{t=String(t||"").trim();for(const s of [":"," — "," – "]){if(t.includes(s)){const x=t.split(s)[0].trim();if(x.length>=18)return x}}if(t.length<=58)return t;let r="";for(const w of t.split(" ")){const x=r?r+" "+w:w;if(x.length>55)break;r=x}return r.replace(/[ ,;:]+$/g,"")+"…"},\n '
              if marker in text:
                  text = text.replace(marker, helper + marker, 1)
          text = text.replace('>${esc(p.title)}</a></h3>', '>${esc(shortTitle(p.title))}</a></h3>')
          text = text.replace('>${esc(DATA.pubs.filter(p=>p.featured)[0].title)}</a></h2>', '>${esc(shortTitle(DATA.pubs.filter(p=>p.featured)[0].title))}</a></h2>')
          root.write_text(text, encoding="utf-8")

          # A página estática de artigos também recebe a mesma regra de
          # apresentação quando utiliza títulos diretamente nos cards.
          listing = Path("artigos/index.html")
          if listing.exists():
              t = listing.read_text(encoding="utf-8")
              if 'shortTitle=t=>{' not in t and 'cards=l=>l.length?' in t:
                  t = t.replace('cards=l=>l.length?', helper + 'cards=l=>l.length?', 1)
              t = t.replace('>${esc(p.title)}</a></h3>', '>${esc(shortTitle(p.title))}</a></h3>')
              listing.write_text(t, encoding="utf-8")

          # Este workflow é deliberadamente de uso único: o resultado final
          # não mantém automação adicional no repositório.
          wf = Path(".github/workflows/once-reintegrate-publication-titles.yml")
          if wf.exists():
              wf.unlink()

          print("Arquivos alterados:")
          for p in changed:
              print(p)

      - name: Commit das alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html artigos .github/workflows/once-reintegrate-publication-titles.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Reintegrar títulos completos ao conteúdo das publicações"
          git push
