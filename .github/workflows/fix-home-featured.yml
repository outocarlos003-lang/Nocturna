name: Ajustar tela inicial
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manter somente o conteúdo em destaque na inicial
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          pattern = r'home:\(\)=>\(\{.*?\}\),\n grid:'
          replacement = '''home:()=>({t:"Início",d:"Nocturna: publicação digital de leitura em metafísica, teologia, ficção, psicologia e filosofia.",h:`${DATA.pubs.filter(p=>p.featured)[0]?`<section class="featured"><p class="eyebrow">Em destaque</p><h2><a href="#/artigos/${esc(DATA.pubs.filter(p=>p.featured)[0].id)}">${esc(shortTitle(DATA.pubs.filter(p=>p.featured)[0].title))}</a></h2><p>${esc(DATA.pubs.filter(p=>p.featured)[0].summary||"")}</p></section>`:`<p class="empty">Nenhum conteúdo está marcado como em destaque.</p>`}`}),
 grid:'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('Estrutura esperada de P.home não encontrada; nenhuma alteração foi feita.')
          path.write_text(new_text, encoding='utf-8')

      - name: Commitar alteração e remover temporários
        run: |
          rm -f .github/workflows/fix-home-featured.yml .nocturna-home-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-home-featured.yml .nocturna-home-fix-trigger
          git diff --cached --quiet && exit 0
          git commit -m "Deixar somente o destaque na tela inicial"
          git push