name: Remove home publication cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove publication cards from home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '${cards(find({}).slice(0,6))}'
          if old not in s:
              raise SystemExit('Trecho esperado não encontrado')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/remove-home-publications.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/remove-home-publications.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remover publicações da tela inicial'
          git push
