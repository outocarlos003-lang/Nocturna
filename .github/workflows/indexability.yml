name: Validar camada pública do site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sitemap.mjs"
      - "validate.mjs"
      - ".github/workflows/indexability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar fonte editorial única
        run: node validate.mjs

      - name: Gerar cascas públicas em ambiente descartável
        run: node sitemap.mjs "https://outocarlos003-lang.github.io/Nocturna/"

      - name: Verificar núcleo e rota compatível
        run: |
          grep -q "A Dupla Dinâmica da Santificação" index.html
          test -f artigos/a-dupla-dinamica-da-santificacao/index.html
          test $(wc -c < artigos/a-dupla-dinamica-da-santificacao/index.html) -lt 5000
          grep -q 'location.replace(root+"#"+route' artigos/a-dupla-dinamica-da-santificacao/index.html
          grep -q "index.html:DATA" sitemap.mjs
