name: Atualizar camada rastreável do site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sitemap.mjs"
      - "neural-index.mjs"
      - "robots.txt"
      - "explorar/index.html"
      - ".github/workflows/indexability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexability:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conectar a página inicial ao explorador e ao mapa neural
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='index.html';
          let s=fs.readFileSync(file,'utf8');
          const nav='<li><a href="explorar/">Explorar acervo</a></li>';
          if(!s.includes('href="explorar/"')) s=s.replace('<ul id="tree"></ul>','<ul id="tree"></ul>'+nav);
          const heroLinks='<p class="archive-actions"><a class="btn" href="explorar/">Explorar pastas e subpastas</a><a class="btn alt" href="mapa-neural/">Mapa neural</a></p>';
          if(!s.includes('archive-actions')) s=s.replace('</section>${DATA.pubs.filter(p=>p.featured)',heroLinks+'</section>${DATA.pubs.filter(p=>p.featured)');
          const css='.archive-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 0}.archive-actions a{color:#fff}.archive-actions .alt{color:var(--ink)}';
          if(!s.includes('.archive-actions{')) s=s.replace('</style>',css+'</style>');
          fs.writeFileSync(file,s);
          NODE

      - name: Gerar páginas rastreáveis, sitemap e grafo neural
        run: |
          node sitemap.mjs "https://outocarlos003-lang.github.io/Nocturna/"
          node neural-index.mjs "https://outocarlos003-lang.github.io/Nocturna/"

      - name: Publicar alterações geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt artigos categorias tags arquivo sobre faq contato privacidade mapa-neural dados-neurais explorar
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de indexação."
          else
            git commit -m "Conecta navegação neural ao acervo [skip ci]"
            git push
          fi
