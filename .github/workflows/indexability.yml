name: Atualizar camada rastreável do site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sitemap.mjs"
      - "robots.txt"
      - ".github/workflows/indexability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexability:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar páginas rastreáveis e sitemap
        run: node sitemap.mjs "https://outocarlos003-lang.github.io/Nocturna/"

      - name: Publicar alterações geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt artigos categorias tags arquivo sobre faq contato privacidade
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de indexação."
          else
            git commit -m "Atualiza camada rastreável [skip ci]"
            git push
          fi
