name: Atualizar camada rastreável do site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sitemap.mjs"
      - "neural-index.mjs"
      - "neural-navigation.mjs"
      - "robots.txt"
      - "explorar/index.html"
      - ".github/workflows/indexability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexability:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Remover Mapa neural da interface pública
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='index.html';
          let s=fs.readFileSync(file,'utf8');
          const nav='<li><a href="explorar/">Explorar acervo</a></li>';
          if(!s.includes('href="explorar/"')) s=s.replace('<ul id="tree"></ul>','<ul id="tree"></ul>'+nav);
          s=s.replace(/<a\b[^>]*href=["'][^"']*mapa-neural[^"']*["'][^>]*>[\s\S]*?<\/a>/gi,'');
          s=s.replace(/<a\b[^>]*>[\s\S]*?Mapa neural[\s\S]*?<\/a>/gi,'');
          const guard=`<style id="nocturna-hide-neural-map">a[href*="mapa-neural"],button[data-neural-map],.neural-map-link{display:none!important}</style><script id="nocturna-hide-neural-map-script">(()=>{const hide=()=>{document.querySelectorAll('a[href*="mapa-neural"],button[data-neural-map],.neural-map-link').forEach(e=>e.remove());document.querySelectorAll('a,button').forEach(e=>{if(e.textContent.trim().toLocaleLowerCase('pt-BR')==='mapa neural')e.remove()})};new MutationObserver(hide).observe(document.documentElement,{subtree:true,childList:true});hide()})();</script>`;
          if(!s.includes('nocturna-hide-neural-map-script')) s=s.replace('</head>',guard+'</head>');
          fs.writeFileSync(file,s);
          NODE

      - name: Gerar sitemap e grafo sem perda de dados
        run: |
          node sitemap.mjs "https://outocarlos003-lang.github.io/Nocturna/"
          node neural-index.mjs "https://outocarlos003-lang.github.io/Nocturna/"

      - name: Injetar navegação neural em todas as páginas
        run: node neural-navigation.mjs

      - name: Publicar alterações geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml robots.txt artigos categorias tags arquivo sobre faq contato privacidade mapa-neural dados-neurais explorar *.html neural-navigation.mjs
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de indexação."
          else
            git commit -m "Oculta definitivamente o Mapa neural da interface [skip ci]"
            git push
          fi
