name: Deploy Nocturna to GitHub Pages

on:
  # Publica cada push normal em main; commits marcados como [skip ci] não disparam Actions.
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar páginas públicas, sitemap e grafo
        run: |
          node sitemap.mjs "https://outocarlos003-lang.github.io/Nocturna/"
          node neural-index.mjs "https://outocarlos003-lang.github.io/Nocturna/"
          node neural-navigation.mjs

      - name: Padronizar rodapé
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = "Nocturna. Todos os direitos reservados.<br>By Riquelmi."
          new = '© 2026 Nocturna. Todos os direitos reservados.<br><span class="footer-credit">Por Riquelmi</span>'
          for path in Path(".").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validar estrutura pública
        run: |
          test -f index.html
          test -f .nojekyll
          test -f robots.txt
          test -f sitemap.xml
          test -f artigos/a-dupla-dinamica-da-santificacao/index.html

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
