name: Linkar Publicações
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar título Publicações
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<h2>Publicações</h2>'
          new = '<h2><a class="publicacoes-link" href="publicacoes/">Publicações</a></h2>'
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace('.card h3{margin:.1rem 0 .4rem}.card a{text-decoration:none}', '.card h3{margin:.1rem 0 .4rem}.card a{text-decoration:none}.publicacoes-link{text-decoration:none;color:inherit}', 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Tornar Publicações um link para as 10 postagens"
      - name: Remover workflow temporário
        run: |
          rm -f .github/workflows/once-link-publicacoes.yml
          git add .github/workflows/once-link-publicacoes.yml
          git diff --cached --quiet || git commit -m "Remover workflow temporário de Publicações"
      - name: Enviar alterações
        run: git push
