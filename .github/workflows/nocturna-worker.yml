name: Deploy Nocturna reply API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.js"
      - "wrangler.jsonc"
      - ".github/workflows/nocturna-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
