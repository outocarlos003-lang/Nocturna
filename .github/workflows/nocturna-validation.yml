name: Nocturna validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate public route shells and sitemap
        run: node sitemap.mjs https://outocarlos003-lang.github.io/Nocturna/

      - name: Validate editorial data
        run: node validate.mjs

      - name: Validate canonical comments
        run: node scripts/validate-comments.mjs

      - name: Validate repository structure
        run: node scripts/validate-system.mjs

      - name: Validate asset loading
        run: node scripts/validate-assets.mjs
