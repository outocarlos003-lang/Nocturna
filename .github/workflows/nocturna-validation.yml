name: Nocturna validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check duplicate policy syntax
        run: node --check scripts/check-editorial-duplicate.mjs

      - name: Test 90% duplicate policy
        run: node scripts/check-editorial-duplicate.mjs --self-test

      - name: Check editorial request validator syntax
        run: node --check scripts/validate-editorial-request.mjs

      - name: Test editorial request validator
        run: node scripts/test-editorial-request-validator.mjs

      - name: Generate public route shells and sitemap
        run: node sitemap.mjs https://outocarlos003-lang.github.io/Nocturna/

      - name: Validate editorial data
        run: node validate.mjs

      - name: Validate canonical comments
        run: node scripts/validate-comments.mjs

      - name: Validate repository structure
        run: node scripts/validate-system.mjs

      - name: Validate asset loading
        run: node scripts/validate-assets.mjs
