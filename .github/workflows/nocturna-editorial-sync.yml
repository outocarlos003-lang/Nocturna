name: Nocturna editorial sync

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nocturna-editorial-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Synchronize editorial sources into the single DATA registry
        run: node scripts/sync-editorial.mjs

      - name: Regenerate public route shells, sitemap and robots
        run: node sitemap.mjs https://outocarlos003-lang.github.io/Nocturna/

      - name: Validate complete editorial system
        run: |
          node validate.mjs
          node scripts/validate-comments.mjs
          node scripts/validate-system.mjs
          node scripts/validate-assets.mjs

      - name: Commit generated editorial indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma atualização gerada."
            exit 0
          fi
          git commit -m "chore: sync editorial publication indexes"
          git push
