    <circle cx="800" cy="450" r="205"/>
    <circle cx="800" cy="450" r="135"/>
  </g>
  <path d="M800 820 C770 690 772 570 800 450 C828 330 830 210 800 80" stroke="url(#beam)" stroke-width="18" opacity="0.48" filter="url(#soft)"/>
  <path d="M800 835 C785 690 787 570 800 450 C813 330 815 205 800 65" stroke="#fff6d2" stroke-opacity="0.78" stroke-width="2"/>
  <g stroke="#8e7cae" stroke-opacity="0.52" stroke-width="2">
