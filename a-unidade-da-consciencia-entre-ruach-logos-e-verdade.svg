<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A Unidade da Consciência entre RUACH, Logos e Verdade</title>
  <desc id="desc">Composição dark romanticism com uma consciência fragmentada convergindo para um eixo luminoso, traduzindo visualmente a passagem do ruído e da fragmentação para a integração e a direção segundo a Verdade.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#242033"/>
      <stop offset="0.48" stop-color="#0d0c16"/>
      <stop offset="1" stop-color="#030307"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d2" stop-opacity="0.98"/>
      <stop offset="0.2" stop-color="#c9b9ff" stop-opacity="0.62"/>
      <stop offset="0.58" stop-color="#7668b7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7668b7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f5e6bd" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#e7d9ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff9df" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
