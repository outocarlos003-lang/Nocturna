<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A Espada de Dois Gumes e o Último Refúgio do Eu</title>
<desc id="desc">Composição dark romanticism de uma espada luminosa de dois gumes atravessando uma arquitetura escura fragmentada ao redor de um centro humano simbólico.</desc>
<defs>
<radialGradient id="bg"><stop stop-color="#30242a"/><stop offset=".5" stop-color="#141116"/><stop offset="1" stop-color="#050508"/></radialGradient>
<linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5e8d0"/><stop offset=".35" stop-color="#bfa88f"/><stop offset=".55" stop-color="#eee1c9"/><stop offset="1" stop-color="#6f5360"/></linearGradient>
<radialGradient id="heart"><stop stop-color="#c78e82" stop-opacity=".85"/><stop offset=".5" stop-color="#6d3d4b" stop-opacity=".4"/><stop offset="1" stop-color="#24151d" stop-opacity="0"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="800" cy="450" rx="520" ry="340" fill="#6f4050" opacity=".12" filter="url(#soft)"/>
<circle cx="800" cy="455" r="170" fill="url(#heart)" filter="url(#glow)"/>
<path d="M800 90 L842 420 L800 790 L758 420 Z" fill="url(#blade)" opacity=".94"/>
<path d="M800 90 L800 790" stroke="#fff4df" stroke-width="3" opacity=".7"/>
<path d="M720 410 L800 450 L880 410 L800 490 Z" fill="#1b1117" stroke="#caa789" stroke-width="5"/>
<path d="M735 450 C640 345 520 315 390 365 C535 370 610 430 680 500" fill="none" stroke="#9a6876" stroke-width="18" opacity=".38"/>
<path d="M865 450 C960 345 1080 315 1210 365 C1065 370 990 430 920 500" fill="none" stroke="#9a6876" stroke-width="18" opacity=".38"/>
<g fill="none" stroke="#70505d" stroke-width="7" opacity=".7">
<path d="M160 170 L510 300 L650 180"/><path d="M1440 170 L1090 300 L950 180"/>
<path d="M150 735 L500 600 L650 720"/><path d="M1450 735 L1100 600 L950 720"/>
</g>
<g fill="#c8a98d" opacity=".28">
<path d="M310 210 L650 410 L430 445 Z"/><path d="M1290 210 L950 410 L1170 445 Z"/>
<path d="M300 690 L650 490 L430 455 Z"/><path d="M1300 690 L950 490 L1170 455 Z"/>
</g>
<g fill="#e5cfb4">
<circle cx="205" cy="115" r="3"/><circle cx="1390" cy="120" r="4"/><circle cx="180" cy="800" r="4"/><circle cx="1410" cy="790" r="3"/>
</g>
<rect x="40" y="40" width="1520" height="820" fill="none" stroke="#714957" stroke-width="2" opacity=".55"/>
</svg>