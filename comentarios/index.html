<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Pensadores — Nocturna</title>
<style>
:root{color-scheme:dark}html,body{margin:0;min-height:100%;background:#101011}body{overflow-y:auto;overflow-x:hidden}.topbar{width:min(960px,calc(100% - 32px));margin:0 auto;padding:14px 0 10px;background:#101011;position:relative;z-index:2}.home{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid #30343a;border-radius:10px;background:#15171a;color:#eeeae4;font:600 .95rem Arial,Helvetica,sans-serif;text-decoration:none}.home:hover{background:#3b2630;border-color:#8f5268;color:#fff}.back{display:none!important}.frame{width:100%;height:100vh;min-height:720px;border:0;display:block;background:#101011}@media(max-width:650px){.topbar{width:100%;padding:10px 18px 8px}.home{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="topbar"><a class="home" href="/Nocturna/" aria-label="Ir para a página inicial da Nocturna">⌂ Home</a></div>
<iframe id="quotes-frame" class="frame" src="./base.html?embed=1" title="Pensadores da Nocturna" loading="eager"></iframe>
<script>
(()=>{"use strict";
const frame=document.querySelector("#quotes-frame");
const resize=height=>{const value=Number(height);if(Number.isFinite(value)&&value>0)frame.style.height=Math.max(value,720)+"px"};
addEventListener("message",event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=="nocturna-quotes-height")return;resize(event.data.height)});
frame.addEventListener("load",()=>{try{resize(frame.contentDocument.documentElement.scrollHeight)}catch{}});
})();
</script>
</body>
</html>
