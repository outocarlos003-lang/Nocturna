<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>Comentários — Nocturna</title>
<style>
:root{color-scheme:light}
html,body{margin:0;min-height:100%;background:#f7f3ed}
body{overflow-y:auto;overflow-x:hidden}
.frame{width:100%;height:100vh;min-height:720px;border:0;display:block;background:#f7f3ed}
</style>
</head>
<body>
<iframe id="comments-frame" class="frame" src="./base.html?embed=1" title="Discussão canônica da Nocturna" loading="eager"></iframe>
<script>
(()=>{"use strict";
const frame=document.querySelector("#comments-frame");
const resize=(height)=>{const value=Number(height);if(Number.isFinite(value)&&value>0)frame.style.height=Math.max(value,720)+"px"};
addEventListener("message",event=>{
  if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=="nocturna-comments-height")return;
  resize(event.data.height);
});
frame.addEventListener("load",()=>{try{resize(frame.contentDocument.documentElement.scrollHeight)}catch{}});
})();
</script>
</body>
</html>
