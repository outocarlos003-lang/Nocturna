<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<title>Pensadores — Nocturna</title>
<style>
:root{color-scheme:dark;--bg:#0d0e10;--card:#15171a;--ink:#eeeae4;--muted:#9d9ca1;--soft:#77777d;--line:#30343a;--accent:#b36a85;--accent-bg:#3b2630;--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html{overflow-x:hidden;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow-x:hidden}
main{width:100%;max-width:1120px;margin:0 auto;padding:30px 12px 72px;min-width:0}
.topbar{width:100%;padding:0 0 24px;margin-bottom:24px;border-bottom:1px solid var(--line);min-width:0}
.topbar h1{margin:0;font:700 clamp(1.8rem,4vw,2.5rem) var(--serif)}
.topbar p{margin:7px 0 0;color:var(--muted);max-width:760px}
.search{width:100%;min-height:54px;margin:0 0 24px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:#0c0d0f;color:var(--ink);font:1rem var(--sans);outline:none}
.search:focus{border-color:#666;box-shadow:0 0 0 2px #6662}
.search::placeholder{color:#666970}
#quotes{display:flex;flex-direction:column;gap:14px;width:100%;min-width:0}
.quote{display:block;width:100%;max-width:100%;min-width:0;margin:0;padding:24px 26px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 7px 20px #0005;overflow-wrap:anywhere}
.quote:hover{border-color:var(--line)}
.author{display:block;margin-bottom:13px;color:var(--accent);font:700 1.05rem var(--serif)}
.content{margin:0;color:#eeeae4;font:clamp(1.05rem,2vw,1.24rem)/1.75 var(--serif);overflow-wrap:anywhere;word-break:normal}
.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
:focus-visible{outline:3px solid #d2b5aa;outline-offset:3px}
@media(max-width:650px){main{width:100%;padding:18px 12px 45px}.topbar{padding:0 0 20px}.search{margin-bottom:0}.quote{border-radius:12px;padding:20px 18px}.content{font-size:1.08rem;line-height:1.67}}
</style>
</head>
<body>
<main>
<header class="topbar">
<h1>Pensadores</h1>
<p>Uma constelação de vozes para pensar além do óbvio: aqui, ideias não são enfeite nem autoridade — são faíscas. Reunimos frases de pensadores para provocar, confrontar e ampliar o pensamento; porque uma frase digna de ser guardada não encerra a questão: abre outra.</p>
</header>
<input class="search" id="search" type="search" placeholder="Pesquisar pensadores ou frases..." aria-label="Pesquisar pensadores ou frases">
<section id="quotes" aria-label="Coleção de pensamentos"></section>
<script>
(()=>{"use strict";
const root=document.querySelector("#quotes"),search=document.querySelector("#search");
let entries=[];
const render=()=>{
 const term=search.value.trim().toLocaleLowerCase("pt-BR");
 const filtered=entries.filter(q=>(q.author+" "+q.content).toLocaleLowerCase("pt-BR").includes(term));
 root.replaceChildren();
 if(!filtered.length){const e=document.createElement("p");e.className="empty";e.textContent="Nenhuma frase encontrada.";root.appendChild(e);return}
 filtered.forEach(q=>{
  const article=document.createElement("article");article.className="quote";
  const author=document.createElement("span");author.className="author";author.textContent=q.author;
  const content=document.createElement("p");content.className="content";content.textContent=q.content;
  article.append(author,content);root.appendChild(article);
 });
};
fetch("../data/philosophical-quotes.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(data=>{entries=Array.isArray(data.entries)?data.entries:[];render()}).catch(()=>{root.innerHTML='<p class="empty">Não foi possível carregar a coleção de frases.</p>'});
search.addEventListener("input",render);
if(new URLSearchParams(location.search).get("embed")==="1"){
 const send=()=>{if(window.parent!==window)window.parent.postMessage({type:"nocturna-quotes-height",height:document.documentElement.scrollHeight},location.origin)};
 addEventListener("load",()=>{send();setTimeout(send,100);setTimeout(send,500)});
 if("ResizeObserver" in window)new ResizeObserver(send).observe(document.documentElement);
}
})();
</script>
</main>
</body>
</html>
