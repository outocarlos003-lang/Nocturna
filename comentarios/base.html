<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow">
<title>Comentários — Nocturna</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d0e10;
  --card:#15171a;
  --card-2:#191b1f;
  --field:#111316;
  --ink:#eeeae4;
  --muted:#9d9ca1;
  --soft:#77777d;
  --line:#30343a;
  --line-2:#24272c;
  --accent:#8f5268;
  --accent-2:#b36a85;
  --accent-bg:#3b2630;
  --like:#f0b73d;
  --heart:#ef5a62;
  --idea:#ffd83d;
  --serif:Georgia,"Times New Roman",serif;
  --sans:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html{overflow-x:hidden;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.55 var(--sans);
  overflow-x:hidden;
}
button,input,textarea,select{font:inherit}
main{width:min(1120px,calc(100% - 24px));margin:0 auto;padding:30px 0 72px}
.topbar{padding:0 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:1.7rem;font-weight:700}
.topbar-search{
  width:100%;
  min-height:58px;
  padding:0 20px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#0c0d0f;
  color:var(--ink);
  font-size:1.15rem;
  outline:none;
  margin-bottom:26px;
}
.topbar-search:focus{border-color:#555b63;box-shadow:0 0 0 2px #555b6320}
.topbar-search::placeholder{color:#666970}
.original-composer{
  margin:0 0 34px;
  padding:30px 34px 28px;
  border:1px solid #30343a;
  border-radius:18px;
  background:var(--card);
  box-shadow:0 7px 20px #0005;
}
.original-badge{
  display:inline-flex;
  align-items:center;
  min-height:42px;
  padding:0 20px;
  border:1px solid #3c4249;
  border-radius:24px;
  color:#bcbcc0;
  background:#15171a;
  margin-bottom:22px;
}
.original-form textarea{
  height:145px;
  min-height:145px;
  max-height:145px;
  border-radius:14px;
  background:#0c0d0f;
  font-size:1.05rem;
  padding:18px;
}
.original-meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--soft);font-size:.9rem}
.original-actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px;align-items:center}
.original-clear{
  border:0;
  background:transparent;
  color:#c5c1c2;
  min-height:54px;
  cursor:pointer;
}
.original-send{
  min-height:54px;
  border:1px solid #8f5268;
  border-radius:10px;
  background:#633547;
  color:#eee;
  cursor:pointer;
  font-size:1.05rem;
}
.original-send:hover{background:#7b4359}
.original-status{margin:14px 0 0;color:var(--muted);font-size:.88rem}
@media(max-width:650px){
  .topbar-search{border-radius:12px;margin-bottom:20px}
  .original-composer{margin:0 0 24px;padding:22px 18px;border-radius:0;border-left:0;border-right:0}
  .original-form textarea{min-height:145px}
  .original-actions{grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
}
@media(max-width:390px){
  .original-actions{grid-template-columns:1fr}
}
.topbar p{margin:4px 0 0;color:var(--muted)}
#tree{display:block;min-width:0}
.thread-root{position:relative}
.comment{
  position:relative;
  min-width:0;
  padding:20px 22px 18px;
  background:var(--card);
  border:1px solid #30343a;
  border-radius:17px;
  box-shadow:0 7px 20px #0005;
}
.comment.reply{
  margin-left:42px;
  margin-top:0;
  border-width:0 0 1px 1px;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  padding:18px 20px 18px 25px;
}
.comment.reply:before{
  content:"";
  position:absolute;
  left:-1px;
  top:0;
  bottom:0;
  border-left:2px solid #2c3137;
}
.comment.reply:after{
  content:"";
  position:absolute;
  left:-1px;
  top:57px;
  width:23px;
  border-top:2px solid #2c3137;
}
.comment.reply:last-child:before{bottom:calc(100% - 58px)}
.comment.reply.reply-target,
.comment.reply.reply-target:before{
  border-color:#b36a85;
}
.comment.reply-target{
  background:linear-gradient(90deg,#3b263022,transparent);
  box-shadow:inset 4px 0 0 #b36a85,0 0 0 2px #8f526833;
  border-radius:10px;
  scroll-margin-top:24px;
}
.comment.reply-target .content{color:#fff}
.comment.reply-target .composer.open{border-color:#b36a85;box-shadow:0 0 0 2px #8f526825}
.comment-head{
  display:grid;
  grid-template-columns:50px minmax(0,1fr) auto;
  gap:13px;
  align-items:center;
}
.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#171b20;
  border:1px solid #20252b;
  color:#ddd;
  font-weight:700;
  font-size:1.05rem;
}
.author-wrap{min-width:0}
.author{
  display:block;
  color:var(--ink);
  font-size:1.05rem;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.context{
  display:block;
  margin-top:3px;
  color:var(--accent-2);
  font-size:.92rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.corner{
  color:var(--soft);
  font-size:.82rem;
  white-space:nowrap;
}
.corner a{color:var(--accent-2);text-decoration:none}
.content{
  margin:17px 0 17px;
  color:#eeeae4;
  font-size:clamp(1.05rem,2.2vw,1.28rem);
  line-height:1.72;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
.reply .content{font-size:clamp(1rem,2vw,1.16rem);margin-top:14px}
.toolbar{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
  padding-top:12px;
  border-top:1px solid var(--line-2);
}
.tool{
  border:0;
  background:none;
  color:#b6b5b8;
  padding:5px 0;
  cursor:pointer;
  font-size:.98rem;
  text-decoration:none;
}
.tool:hover{color:#fff}
.tool.primary{
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#17191c;
}
.tool.primary:hover{background:var(--accent-bg);border-color:var(--accent)}
.reaction{
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.reaction .emoji{font-size:1.05rem}
.reaction.active{color:#fff}
.reaction.like.active{color:var(--like)}
.reaction.heart.active{color:var(--heart)}
.reaction.idea.active{color:var(--idea)}
.participate{
  color:#c4c1c3;
  text-decoration:underline;
  text-underline-offset:3px;
}
.participate:before{content:"💬 "}
.children{
  margin-left:42px;
  padding-left:0;
}
.composer{
  display:none;
  margin-top:17px;
  padding:18px;
  border:1px solid #30353b;
  border-radius:13px;
  background:var(--card-2);
}
.composer.open{display:block}
textarea{
  width:100%;
  min-height:145px;
  padding:15px;
  border:1px solid #343940;
  border-radius:10px;
  background:var(--field);
  color:var(--ink);
  outline:none;
  resize:vertical;
}
textarea:focus{border-color:#8b6b77;box-shadow:0 0 0 2px #8b6b7725}
textarea::placeholder{color:#66676d}
.composer-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--soft);font-size:.88rem}
.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.composer-actions{display:flex;gap:8px}
.action{
  min-height:42px;
  padding:8px 16px;
  border:1px solid #3b3f46;
  border-radius:7px;
  background:transparent;
  color:#c9c4c0;
  cursor:pointer;
}
.action:hover{background:var(--accent-bg);border-color:var(--accent)}
.action.send{background:#704052;border-color:#8f5268;color:#fff}
.action.send:hover{background:#8f5268}
.action:disabled{opacity:.5;cursor:not-allowed}
.message{margin-top:9px;color:var(--muted);font-size:.88rem}
.message.ok{color:#b9d7b1}
.message.err{color:#e1a0a0}
:focus-visible{outline:3px solid #d2b5aa;outline-offset:3px}
.sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

@media(max-width:650px){
  main{width:100%;padding:0 0 45px}
  .topbar{padding:18px 18px 15px;margin-bottom:0}
  .topbar h1{font-size:1.35rem}
  .comment{
    border-radius:0;
    border-left:0;
    border-right:0;
    padding:18px 18px 16px;
    box-shadow:none;
  }
  .comment.reply{
    margin-left:40px;
    padding:16px 16px 17px 23px;
    border-left:0;
    border-right:0;
  }
  .comment.reply:after{width:14px;top:52px}
  .children{width:100%;margin-left:0}
  .comment-head{grid-template-columns:48px minmax(0,1fr) auto;gap:11px}
  .avatar{width:48px;height:48px}
  .corner{font-size:.75rem}
  .content{font-size:1.08rem;line-height:1.62;margin:14px 0}
  .reply .content{font-size:1.04rem}
  .toolbar{gap:16px}
  .toolbar .tool.primary{order:0}
  .composer{border-radius:10px;margin-top:14px;padding:13px}
  .composer-bottom{display:grid;grid-template-columns:1fr}
  .composer-actions,.composer-actions .action{width:100%}
  .composer-actions{display:grid;grid-template-columns:1fr 1fr}
}
@media(max-width:390px){
  .comment.reply{margin-left:28px;padding-left:18px}
  .comment-head{grid-template-columns:42px minmax(0,1fr)}
  .avatar{width:42px;height:42px}
  .corner{grid-column:2}
  .toolbar{gap:12px}
  .reaction{font-size:.9rem}
}
</style>
</head>
<body>
<main>
<header class="topbar">
  <input class="topbar-search" id="comment-search" type="search" placeholder="Pesquisar..." aria-label="Pesquisar comentários">
  <h1>Comentários</h1>
  
</header>

<section class="original-composer" aria-label="Nova mensagem">
  <div class="original-badge">Público</div>
  <form class="original-form" id="original-form">
    <textarea id="original-message" maxlength="2000" placeholder="Escreva sua mensagem..." aria-label="Mensagem"></textarea>
    <div class="original-meta">
      <span id="original-count">0 / 2000</span>
      <span></span>
    </div>
    <div class="original-actions">
      <button class="original-clear" id="original-clear" type="button">Limpar</button>
      <button class="original-send" type="submit">Enviar ↗</button>
    </div>
    <div class="original-status" id="original-status" aria-live="polite"></div>
  </form>
</section>

<section id="tree" aria-label="Conversa"></section>
</main>

<script>
(()=>{"use strict";
const REPO="outocarlos003-lang/Nocturna",ISSUE=1;
const ISSUE_URL=`https://github.com/${REPO}/issues/${ISSUE}`;
const COMMENT_URL_RE=/^https:\/\/github\.com\/outocarlos003-lang\/Nocturna\/issues\/1#issuecomment-\d+$/;
const tree=document.querySelector("#tree");
const key=(type,id)=>"nocturna-"+type+"-"+id;
const draftKey=id=>key("draft",id);
const pendingReplyKey=id=>key("pending-reply",id);
const composerOpeners=new Map();

function initials(name){
  return (name||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}
function childrenMap(nodes){
  const map=new Map();
  nodes.forEach(n=>{
    const p=n.parentNodeId===null?"root":String(n.parentNodeId);
    if(!map.has(p))map.set(p,[]);
    map.get(p).push(n);
  });
  return map;
}
function savedReactions(id){
  try{return JSON.parse(localStorage.getItem(key("reactions",id))||"{}")}catch{return{}}
}
function setReaction(id,type){
  const r=savedReactions(id);
  r[type]=!r[type];
  try{localStorage.setItem(key("reactions",id),JSON.stringify(r))}catch{}
  return r;
}
function count(id,type){
  const r=savedReactions(id);
  return r[type]?1:0;
}
function composerFor(n,box){
  const composer=document.createElement("div");
  composer.className="composer";
  composer.dataset.parentNode=String(n.nodeId);
  composer.dataset.parentComment=String(n.commentId||"");
  composer.dataset.parentAuthor=String(n.author?.displayName||"");
  const form=document.createElement("form");
  const textarea=document.createElement("textarea");
  textarea.maxLength=2000;
  textarea.placeholder="Escreva sua mensagem...";
  textarea.setAttribute("aria-label","Mensagem");
  try{textarea.value=localStorage.getItem(draftKey(n.nodeId))||""}catch{}
  form.appendChild(textarea);

  const meta=document.createElement("div");
  meta.className="composer-meta";
  const counter=document.createElement("span");
  counter.textContent=textarea.value.length+" / 2000";
  meta.appendChild(counter);
  meta.appendChild(document.createElement("span"));
  form.appendChild(meta);

  const bottom=document.createElement("div");
  bottom.className="composer-bottom";

  const actions=document.createElement("div");
  actions.className="composer-actions";
  const cancel=document.createElement("button");
  cancel.type="button";cancel.className="action";cancel.textContent="Cancelar";
  const send=document.createElement("button");
  send.type="submit";send.className="action send";send.textContent="Enviar";
  actions.append(cancel,send);
  bottom.appendChild(actions);
  form.appendChild(bottom);

  const msg=document.createElement("div");
  msg.className="message";
  msg.setAttribute("aria-live","polite");
  form.appendChild(msg);
  composer.appendChild(form);

  const open=()=>{composer.classList.add("open");setTimeout(()=>textarea.focus(),0)};
  composerOpeners.set(String(n.nodeId),open);
  const close=()=>{composer.classList.remove("open");msg.textContent="";msg.className="message"};
  textarea.addEventListener("input",()=>{
    counter.textContent=textarea.value.length+" / 2000";
    try{localStorage.setItem(draftKey(n.nodeId),textarea.value)}catch{}
  });
  textarea.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();form.requestSubmit()}
  });
  cancel.addEventListener("click",close);
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const message=textarea.value.trim();
    if(!message){msg.textContent="Escreva sua mensagem antes de enviar.";msg.className="message err";return}
    send.disabled=true;
    const api=window.NOCTURNA_REPLY_API||"";
    if(!api){
      msg.textContent="O mecanismo de publicação no GitHub ainda não está configurado.";
      msg.className="message err";
      send.disabled=false;
      return;
    }
    try{
      const requestId=crypto.randomUUID?crypto.randomUUID().replace(/-/g,""):String(Date.now());
      const response=await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        message,
        parentNode:String(n.nodeId),
        parentComment:String(n.commentId),
        parentAuthor:n.author?.displayName||"",
        requestId
      })});
      const result=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(result.error||"Não foi possível enviar.");
      const parentUrl=String(result.parent_url||"");
      if(!COMMENT_URL_RE.test(parentUrl)) throw new Error("O GitHub não retornou um permalink válido do comentário respondido.");
      try{localStorage.removeItem(draftKey(n.nodeId))}catch{}
      // O fragment #issuecomment-ID é o permalink nativo do GitHub e faz o
      // GitHub posicionar/destacar exatamente o comentário respondido.
      window.location.href=parentUrl;

      return;
    }catch(err){msg.textContent=err.message||"Não foi possível enviar.";msg.className="message err"}
    finally{send.disabled=false}
  });
  return {open,element:composer};
}

function makeComment(n,map,isRoot=false){
  const wrap=document.createElement("div");
  wrap.className="thread-node";
  const article=document.createElement("article");
  article.className="comment"+(isRoot?"":" reply");
  article.id="node-"+n.nodeId;

  const head=document.createElement("div");
  head.className="comment-head";
  const avatar=document.createElement("div");
  avatar.className="avatar";avatar.textContent=initials(n.author?.displayName);
  const authorWrap=document.createElement("div");
  authorWrap.className="author-wrap";
  const author=document.createElement("span");author.className="author";author.textContent=n.author?.displayName||"Participante";
  const context=document.createElement("span");context.className="context";
  context.textContent=isRoot?"Comentário inicial":(n.author?.role||"Respondendo à conversa");
  authorWrap.append(author,context);
  const corner=document.createElement("div");corner.className="corner";
  if(!isRoot)corner.textContent="↳";
  head.append(avatar,authorWrap,corner);
  article.appendChild(head);

  const content=document.createElement("div");
  content.className="content";content.textContent=n.content||"";
  article.appendChild(content);

  const toolbar=document.createElement("div");
  toolbar.className="toolbar";
  const composerRef=composerFor(n,article);

  const replyButton=document.createElement("button");
  replyButton.type="button";
  replyButton.className="tool primary";
  replyButton.textContent="↩ Responder";
  replyButton.setAttribute("aria-expanded","false");
  replyButton.setAttribute("aria-controls","reply-composer-"+n.nodeId);
  replyButton.addEventListener("click",()=>{
    composerRef.open();
    replyButton.setAttribute("aria-expanded","true");
  });
  toolbar.appendChild(replyButton);

  ["like","heart","idea"].forEach((type)=>{
    const btn=document.createElement("button");
    btn.type="button";btn.className="tool reaction "+type;
    const emoji={like:"👍",heart:"❤️",idea:"💡"}[type];
    btn.innerHTML='<span class="emoji">'+emoji+'</span> <span class="reaction-label">'+(type==="like"?"Curtir":"")+'</span> <span class="count">'+count(n.nodeId,type)+"</span>";
    btn.addEventListener("click",()=>{
      const active=setReaction(n.nodeId,type);
      btn.classList.toggle("active",!!active[type]);
      btn.querySelector(".count").textContent=active[type]?1:0;
    });
    toolbar.appendChild(btn);
  });

  article.appendChild(toolbar);
  composerRef.element.id="reply-composer-"+n.nodeId;
  composerRef.element.setAttribute("aria-label","Responder ao comentário");
  article.appendChild(composerRef.element);

  const children=document.createElement("div");
  children.className="children";
  (map.get(String(n.nodeId))||[]).forEach(child=>children.appendChild(makeComment(child,map,false)));
  wrap.append(article,children);
  return wrap;
}

async function load(){
  try{
    const res=await fetch("../data/comments/issue-1.json",{cache:"no-store"});
    if(!res.ok)throw new Error();
    const data=await res.json(),nodes=data.nodes||[];
    const map=childrenMap(nodes);
    const roots=map.get("root")||[];
    roots.sort((a,b)=>(a.order??0)-(b.order??0));
    roots.forEach(n=>tree.appendChild(makeComment(n,map,true)));

    const params=new URLSearchParams(location.search);
    const replyTo=params.get("replyTo");
    const replySource=params.get("replySource");
    if(replyTo){
      const target=document.getElementById("node-"+replyTo);
      if(target){
        target.classList.add("reply-target");
        setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"center"}),60);
        const pendingKey=replySource?pendingReplyKey(replySource):"";
        let pending=null;
        try{
          if(pendingKey)pending=JSON.parse(localStorage.getItem(pendingKey)||"null");
        }catch{}
        if(pending && String(pending.parentNode)===String(replyTo)){
          const composer=target.querySelector(".composer");
          const textarea=composer?.querySelector("textarea");
          if(textarea){
            textarea.value=String(pending.message||"");
            textarea.dispatchEvent(new Event("input",{bubbles:true}));
            const open=composerOpeners.get(String(replyTo));
            if(open)open();
            try{localStorage.removeItem(pendingKey)}catch{}
          }
        }
      }
    }
  }catch{
    tree.textContent="Não foi possível carregar os comentários.";
  }
}

// Mensagem original: abre a criação de uma nova publicação no GitHub.
const originalForm=document.querySelector("#original-form");
const originalMessage=document.querySelector("#original-message");
const originalCount=document.querySelector("#original-count");
const originalClear=document.querySelector("#original-clear");
const originalStatus=document.querySelector("#original-status");
const search=document.querySelector("#comment-search");

originalMessage.addEventListener("input",()=>{
  originalCount.textContent=originalMessage.value.length+" / 2000";
});
originalClear.addEventListener("click",()=>{
  originalMessage.value="";
  originalCount.textContent="0 / 2000";
  originalStatus.textContent="";
  originalMessage.focus();
});
originalForm.addEventListener("submit",e=>{
  e.preventDefault();
  const message=originalMessage.value.trim();
  if(!message){
    originalMessage.focus();
    return;
  }
  const url="https://github.com/"+REPO+"/issues/new?body="+encodeURIComponent(message);
  window.location.href=url;
});

search.addEventListener("input",()=>{
  const term=search.value.trim().toLocaleLowerCase();
  document.querySelectorAll(".thread-node").forEach(node=>{
    const text=node.textContent.toLocaleLowerCase();
    node.style.display=!term||text.includes(term)?"":"none";
  });
});

const config=document.createElement("script");
config.src="./reply-api-config.js";config.onload=load;config.onerror=load;document.head.appendChild(config);
})();
(()=>{"use strict";
if(new URLSearchParams(location.search).get("embed")!=="1")return;
const send=()=>{if(window.parent!==window)window.parent.postMessage({type:"nocturna-comments-height",height:document.documentElement.scrollHeight},location.origin)};
addEventListener("load",()=>{send();setTimeout(send,100);setTimeout(send,500)});
if("ResizeObserver" in window)new ResizeObserver(send).observe(document.documentElement);
})();
</script>
</body>
</html>
