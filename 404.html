<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Redirecionando — Nocturna</title>
<script>
(()=>{const root="/Nocturna/";const prefix=root.replace(/\/$/,"");const path=location.pathname.startsWith(prefix)?location.pathname.slice(prefix.length):location.pathname.replace(/^\//,"");const route="/"+path.replace(/^\/+|\/+$/g,"");location.replace(root+"#"+(route==="/"?"/":route+"/")+location.search)})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#121212;color:#e9e1cf;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}main{max-width:42rem;padding:2rem}a{color:#e0bfae}</style>
</head>
<body><main><h1>Redirecionando para o núcleo</h1><p>A rota é resolvida pelo <code>index.html</code>, fonte única do conteúdo.</p><p><a href="/Nocturna/">Ir para Nocturna</a></p></main></body>
</html>
