<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Akashi, o Arquétipo da Consciência Inteira</title>
<desc id="desc">Espelho negro fraturado cujas fissuras convergem para um centro de luz marfim, em atmosfera dark romanticism.</desc>
