<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participação · Nocturna</title><style>html,body{margin:0;min-height:100%;background:transparent}#nocturna-frame{display:block;width:100%;height:1200px;border:0}</style></head><body><iframe id="nocturna-frame" title="Discussão encadeada Nocturna" src="base.html"></iframe><script>(function(){const f=document.getElementById("nocturna-frame");const u=new URL("base.html",location.href);u.search=location.search;u.hash="";f.src=u.href;function resize(h){if(Number.isFinite(h)&&h>0)f.style.height=Math.max(300,Math.ceil(h))+"px"}window.addEventListener("message",e=>{if(e.source!==f.contentWindow||e.origin!==location.origin)return;if(e.data&&e.data.type==="nocturna-comments-height")resize(e.data.height)});f.addEventListener("load",()=>{try{const d=f.contentDocument;d.addEventListener("click",async e=>{const send=e.target.closest&&e.target.closest(".reply-send-button");if(!send)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const card=send.closest(".comment");const box=send.closest(".thread");const textarea=box&&box.querySelector("textarea");const message=textarea&&textarea.value.trim();if(!card||!message)return;const parentComment=card.dataset.githubCommentId||"issue-root";const parentNode=card.dataset.thread||"0";const parentAuthor=(card.querySelector(".name")?.textContent||"").trim();if(!parentNode||!parentAuthor)return;const payload=[`<!-- nocturna-parent-node: ${parentNode} -->`,`<!-- nocturna-parent-comment: ${parentComment} -->`,`<!-- nocturna-parent-author: ${parentAuthor} -->`,`<!-- nocturna-reply-author: ${parentAuthor} -->`,message].join("\n");const githubUrl=parentComment==="issue-root"?"https://github.com/outocarlos003-lang/Nocturna/issues/5":"https://github.com/outocarlos003-lang/Nocturna/issues/5#issuecomment-"+encodeURIComponent(parentComment);send.disabled=true;const oldLabel=send.textContent;send.textContent="Preparando…";let copied=false;try{await navigator.clipboard.writeText(payload);copied=true}catch(_){}const note=box&&box.querySelector(".reply-compose-note");if(note){note.textContent=copied?"Resposta copiada. No GitHub, toque em Responder no comentário pai e cole o conteúdo.":"Abra o GitHub e cole manualmente o conteúdo preparado.";note.dataset.status="ready"}send.textContent="Abrir GitHub ↗";send.disabled=false;const opened=window.open(githubUrl,"_blank","noopener,noreferrer");if(!opened){window.location.href=githubUrl}if(copied){setTimeout(()=>{send.textContent=oldLabel},2500)}},true)}catch(_){} });})();</script></body></html>
