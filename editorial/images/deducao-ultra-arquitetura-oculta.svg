<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A Arquitetura Oculta da Dedução Ultra</title>
<desc id="desc">Composição dark romanticism com uma figura central, uma arquitetura geométrica invisível sugerida por linhas, um movimento de vento e um símbolo luminoso de Logos.</desc>
<defs>
  <radialGradient id="bg" cx="70%" cy="35%" r="80%"><stop offset="0" stop-color="#3a1828"/><stop offset=".5" stop-color="#17131a"/><stop offset="1" stop-color="#070709"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1d7b8"/><stop offset="1" stop-color="#8d6170"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<g fill="none" stroke="#9c2d49" stroke-opacity=".38" stroke-width="2">
  <path d="M120 730 L800 120 L1480 730 Z"/><path d="M260 730 L800 250 L1340 730 Z"/><path d="M400 730 L800 380 L1200 730 Z"/>
