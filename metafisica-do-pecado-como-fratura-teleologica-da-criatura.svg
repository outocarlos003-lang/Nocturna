<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A Metafísica do Pecado como Fratura Teleológica da Criatura</title>
<desc id="desc">Arte dark romanticism de um centro luminoso imóvel cercado por fragmentos e correntes de vento, representando Lei, Logos, Ruach e a fratura teleológica da criatura.</desc>
